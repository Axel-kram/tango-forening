<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tango Norteño — Anmälan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f0e8;--surface:#ede6d6;--surface2:#e0d5c0;--border:#c4b49a;--brown:#4a2c1a;--brown-mid:#7a4a2e;--brown-lt:#a67c5b;--cream:#faf6ee;--text:#2e1a0e;--text-lt:#6b4c35;--accent:#8b3a1f;--success:#4a7c59;--danger:#8b1f1f;--font-heading:'Playfair Display',Georgia,serif;--font-body:'Lato',sans-serif;--info:#4a7c59;--info-bg:#f0f5f0;--info-border:#c8dcc8;--info-text:#2e1a0e;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2.5rem 1rem;}
  .brand{font-family:var(--font-heading);font-size:1.1rem;color:var(--brown-lt);letter-spacing:0.06em;margin-bottom:2rem;text-align:center;}
  .brand span{font-style:italic;}
  .card{background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:2.5rem;width:100%;max-width:580px;box-shadow:0 4px 24px rgba(74,44,26,0.12);}
  .form-title{font-family:var(--font-heading);font-size:2rem;color:var(--brown);margin-bottom:0.5rem;line-height:1.2;}
  .form-desc{color:var(--text-lt);font-size:0.95rem;margin-bottom:1.5rem;line-height:1.6;}
  .max-badge{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:0.8rem;color:var(--text-lt);padding:0.25rem 0.9rem;margin-bottom:1.5rem;}
  .field{margin-bottom:1.2rem;}
  .field label{display:block;font-size:0.82rem;font-weight:700;color:var(--brown-mid);margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;}
  .field .req{color:var(--accent);}
  .field input[type=text],.field input[type=email],.field input[type=tel],.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:0.65rem 0.9rem;font-family:var(--font-body);font-size:0.95rem;color:var(--text);transition:border-color 0.2s;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--brown-mid);}
  .field textarea{resize:vertical;min-height:90px;}
  .radio-group,.check-group{display:flex;flex-direction:column;gap:0.5rem;}
  .radio-group label,.check-group label{font-size:0.92rem;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);display:flex;align-items:center;gap:0.6rem;cursor:pointer;}
  .field-error{color:var(--danger);font-size:0.8rem;margin-top:0.3rem;display:none;}
  .field.invalid input,.field.invalid textarea,.field.invalid select{border-color:var(--danger);}
  .field.invalid .field-error{display:block;}
  .info-block{background:var(--info-bg);border:1px solid var(--info-border);border-left:4px solid var(--info);border-radius:5px;padding:0.75rem 1rem;margin-bottom:1.2rem;font-size:0.9rem;color:var(--info-text);line-height:1.5;}
  .submit-btn{background:var(--brown);color:var(--cream);border:none;border-radius:6px;padding:0.85rem 2.5rem;font-family:var(--font-body);font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:0.05em;transition:filter 0.2s,transform 0.1s;width:100%;margin-top:0.5rem;}
  .submit-btn:hover{filter:brightness(1.1);}
  .submit-btn:active{transform:scale(0.99);}
  .submit-btn:disabled{opacity:0.6;cursor:not-allowed;}
  .msg{text-align:center;padding:2rem 1rem;}
  .msg .icon{font-size:2.5rem;margin-bottom:0.7rem;}
  .msg h2{font-family:var(--font-heading);font-size:1.5rem;color:var(--brown);margin-bottom:0.5rem;}
  .msg p{color:var(--text-lt);font-size:0.95rem;}
  .spinner{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:3rem 0;}
  .spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--brown-mid);border-radius:50%;animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .full-notice{background:#f5e0d0;border:1px solid #d4956e;border-radius:8px;padding:1.2rem;text-align:center;margin-bottom:1.5rem;}
  .full-notice h3{color:var(--accent);font-family:var(--font-heading);margin-bottom:0.3rem;}
  .full-notice p{color:var(--text-lt);font-size:0.88rem;}
</style>
</head>
<body>
<div class="brand">Tango <span>Norteño</span></div>
<div class="card" id="mainCard">
  <div class="spinner"><div class="spin"></div><p style="color:var(--text-lt);">Laddar formulär...</p></div>
</div>
<script>
// ── Design/tema ──────────────────────────────────────────
const HEADING_FONTS = ['Playfair Display','Cormorant Garamond','Merriweather','Lora','Libre Baskerville','Abril Fatface'];
const BODY_FONTS = ['Lato','Inter','Open Sans','Nunito','Roboto','Source Sans Pro'];
const FONT_STACK = {
  'Playfair Display': "'Playfair Display',Georgia,serif", 'Cormorant Garamond': "'Cormorant Garamond',Georgia,serif",
  'Merriweather': "'Merriweather',Georgia,serif", 'Lora': "'Lora',Georgia,serif",
  'Libre Baskerville': "'Libre Baskerville',Georgia,serif", 'Abril Fatface': "'Abril Fatface',Georgia,serif",
  'Lato': "'Lato',sans-serif", 'Inter': "'Inter',sans-serif", 'Open Sans': "'Open Sans',sans-serif",
  'Nunito': "'Nunito',sans-serif", 'Roboto': "'Roboto',sans-serif", 'Source Sans Pro': "'Source Sans Pro',sans-serif"
};
const DEFAULT_THEME = { bg:'#f5f0e8', brown:'#4a2c1a', accent:'#8b3a1f', text:'#2e1a0e', info:'#4a7c59', headingFont:'Playfair Display', bodyFont:'Lato' };

function mixHex(hex, mot, andel) {
  const h = String(hex||'#000000').replace('#','');
  const r = parseInt(h.substring(0,2),16)||0, g = parseInt(h.substring(2,4),16)||0, b = parseInt(h.substring(4,6),16)||0;
  const m = mot === 'white' ? 255 : 0;
  const nr = Math.round(r + (m-r)*andel), ng = Math.round(g + (m-g)*andel), nb = Math.round(b + (m-b)*andel);
  return '#' + [nr,ng,nb].map(v => Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
}

function arLjus(hex) {
  const h = String(hex||'#ffffff').replace('#','');
  const r = parseInt(h.substring(0,2),16)||0, g = parseInt(h.substring(2,4),16)||0, b = parseInt(h.substring(4,6),16)||0;
  return (0.299*r + 0.587*g + 0.114*b) > 150;
}

function laddaGoogleFont(namn) {
  const id = 'gf-' + namn.replace(/\s+/g,'-');
  if (document.getElementById(id)) return;
  const link = document.createElement('link');
  link.id = id;
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=' + namn.replace(/\s+/g,'+') + ':wght@300;400;700&display=swap';
  document.head.appendChild(link);
}

function applyTema(theme, el) {
  const t = Object.assign({}, DEFAULT_THEME, theme || {});
  const root = (el || document.documentElement).style;
  root.setProperty('--bg', t.bg);
  root.setProperty('--brown', t.brown);
  root.setProperty('--accent', t.accent);
  root.setProperty('--text', t.text);
  root.setProperty('--surface', mixHex(t.bg, 'black', 0.05));
  root.setProperty('--surface2', mixHex(t.bg, 'black', 0.12));
  root.setProperty('--border', mixHex(t.bg, 'black', 0.22));
  root.setProperty('--brown-mid', mixHex(t.brown, 'white', 0.25));
  root.setProperty('--brown-lt', mixHex(t.brown, 'white', 0.45));
  root.setProperty('--cream', mixHex(t.bg, 'white', 0.35));
  root.setProperty('--text-lt', mixHex(t.text, 'white', 0.35));
  const infoMork = arLjus(t.info) === false;
  root.setProperty('--info-bg', t.info);
  root.setProperty('--info', infoMork ? mixHex(t.info, 'white', 0.45) : mixHex(t.info, 'black', 0.35));
  root.setProperty('--info-border', infoMork ? mixHex(t.info, 'white', 0.25) : mixHex(t.info, 'black', 0.18));
  root.setProperty('--info-text', infoMork ? '#ffffff' : '#2e1a0e');
  root.setProperty('--font-heading', FONT_STACK[t.headingFont] || FONT_STACK['Playfair Display']);
  root.setProperty('--font-body', FONT_STACK[t.bodyFont] || FONT_STACK['Lato']);
  laddaGoogleFont(t.headingFont);
  laddaGoogleFont(t.bodyFont);
}

const WEBHOOK_SPARA = 'https://tango-norteno.duckdns.org/webhook/huvudflow_tangoformular';
const params = new URLSearchParams(location.search);
const formId = params.get('form');
let formularData = null;
let antalAnmalda = 0;

async function laddaFormular() {
  if (!formId) { visaFel('Inget formulär-ID angivet.'); return; }
  try {
    const res = await fetch('https://tango-norteno.duckdns.org/webhook/hamta_formular?id=' + encodeURIComponent(formId));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    const data = Array.isArray(raw) ? raw[0] : raw;
    if (!data || data.error || !data.titel) { visaFel('Formuläret hittades inte.'); return; }
    const falt0 = typeof data.falt_json === 'string' ? JSON.parse(data.falt_json) : (data.falt || []);
    const temaFalt0 = falt0.find(x => x.typ === 'tema');
    applyTema(temaFalt0 ? temaFalt0.tema : null);
    formularData = data;
    antalAnmalda = parseInt(data.anmalningar) || 0;
    visaFormular(data);
  } catch(e) {
    visaFel('Kunde inte ladda formuläret. Försök igen.');
  }
}

function visaFormular(f) {
  const falt = typeof f.falt_json === 'string' ? JSON.parse(f.falt_json) : (f.falt || []);
  const max = f.max ? parseInt(f.max) : null;
  const full = max && antalAnmalda >= max;
  const _pTel = falt.find(x => x.typ==='text' && /partner/i.test(x.namn||'') && !/telefon|tel\b/i.test(x.namn||''));
  const _pToggle = falt.some(x => x.typ==='radio' && /har du partner/i.test(x.namn||''));
  window.__partnerTelId = (_pTel && _pToggle) ? _pTel.id : null;
  window.__formPris = null;
  let html = `<div class="form-title">${escHtml(f.titel)}</div>`;
  if (f.desc) html += `<div class="form-desc">${escHtml(f.desc).replace(/\n/g,'<br>')}</div>`;
  if (max) html += `<div class="max-badge">Platser kvar: ${Math.max(0, max - antalAnmalda)} / ${max}</div>`;
  if (full) {
    html += `<div class="full-notice"><h3>Tyvärr — fullt!</h3><p>Det finns inga lediga platser på detta tillfälle.</p></div>`;
    document.getElementById('mainCard').innerHTML = html;
    return;
  }
  html += `<div class="field" id="f_adress"><label>Adress</label><input type="text" id="inp_adress" placeholder="Gatuadress, postnummer, ort"></div>`;
  falt.forEach(f => {
    if (f.typ === 'info') {
      html += `<div class="info-block">${escHtml(f.infoText || '').replace(/\n/g,'<br>')}</div>`;
      return;
    }
    if (f.typ === 'pris') {
      window.__formPris = f.pris || '';
      html += `<div class="info-block" style="display:flex;justify-content:space-between;align-items:center;"><span style="font-weight:700;">Att betala</span><span style="font-weight:700;">${escHtml(f.pris||'')} kr</span></div>`;
      return;
    }
    if (f.typ === 'tema') return;
    const req = f.obligatorisk ? '<span class="req"> *</span>' : '';
    const _pt = (window.__partnerTelId && f.id === window.__partnerTelId);
    const _pg = (window.__partnerTelId && f.typ==='radio' && /har du partner/i.test(f.namn||''));
    html += `<div class="field" id="flt_${f.id}"${_pt?' style="display:none"':''}><label>${escHtml(f.namn)}${req}</label>`;
    if (f.typ === 'text') html += `<input type="text" name="${f.id}" placeholder="${escHtml(f.placeholder||'')}">`;
    else if (f.typ === 'email') html += `<input type="email" name="${f.id}" placeholder="${escHtml(f.placeholder||'')}">`;
    else if (f.typ === 'tel') html += `<input type="tel" name="${f.id}" placeholder="${escHtml(f.placeholder||'')}">`;
    else if (f.typ === 'textarea') html += `<textarea name="${f.id}" placeholder="${escHtml(f.placeholder||'')}"></textarea>`;
    else if (f.typ === 'checkbox') html += `<div class="check-group"><label><input type="checkbox" name="${f.id}"> ${escHtml(f.namn)}</label></div>`;
    else if (f.typ === 'radio') {
      const alts = (f.alternativ||'').split('\n').filter(a=>a.trim());
      html += `<div class="radio-group">${alts.map(a=>`<label><input type="radio" name="${f.id}" value="${escHtml(a.trim())}"${_pg?' onchange="partnerToggle(this.value)"':''}> ${escHtml(a.trim())}</label>`).join('')}</div>`;
    } else if (f.typ === 'select') {
      const alts = (f.alternativ||'').split('\n').filter(a=>a.trim());
      html += `<select name="${f.id}"><option value="">Välj...</option>${alts.map(a=>`<option value="${escHtml(a.trim())}">${escHtml(a.trim())}</option>`).join('')}</select>`;
    }
    html += `<div class="field-error">Detta fält är obligatoriskt.</div></div>`;
  });
  html += `<div class="section-divider"></div>
           <div class="section-title" style="font-size:1rem;">Samtycke</div>
           <div class="field" id="f_samtycke_gdpr">
             <label>Godkännande av hantering av personuppgifter: <span class="req">*</span></label>
             <div class="check-group"><label><input type="checkbox" id="inp_samtycke_gdpr"> Jag godkänner</label></div>
             <div class="field-error">Du måste godkänna hanteringen av personuppgifter.</div>
           </div>
           <div class="info-block">Vi behöver ditt samtycke för att hantera och lagra dina personuppgifter enligt GDPR. Utan ditt samtycke kan vi inte behandla dina uppgifter eller tillhandahålla våra tjänster.</div>
           <div class="field" id="f_samtycke_foto">
             <label>Jag godkänner att Tango Norteño fotar och filmar under danshelgen. Detta material kan komma att publiceras på föreningens hemsida eller i sociala medier i marknadsföringssyfte. <span class="req">*</span></label>
             <div class="radio-group">
               <label><input type="radio" name="samtycke_foto" value="ja"> ja</label>
               <label><input type="radio" name="samtycke_foto" value="nej"> nej</label>
             </div>
             <div class="field-error">Detta fält är obligatoriskt.</div>
           </div>`;
  html += `<button class="submit-btn" onclick="skickaAnmalan()">Skicka anmälan</button>`;
  document.getElementById('mainCard').innerHTML = html;
}

async function skickaAnmalan() {
  const falt = typeof formularData.falt_json === 'string' ? JSON.parse(formularData.falt_json) : (formularData.falt || []);
  let valid = true;
  const data = [];
  falt.forEach(f => {
    if (f.typ === 'info' || f.typ === 'pris' || f.typ === 'tema') return;
    const container = document.getElementById('flt_' + f.id);
    let value = '';
    if (f.typ === 'radio') {
      const checked = document.querySelector(`input[name="${f.id}"]:checked`);
      value = checked ? checked.value : '';
    } else if (f.typ === 'checkbox') {
      const cb = document.querySelector(`input[name="${f.id}"]`);
      value = cb && cb.checked ? 'Ja' : 'Nej';
    } else {
      const el = document.querySelector(`[name="${f.id}"]`);
      value = el ? el.value.trim() : '';
    }
    if (f.obligatorisk && !value) { container?.classList.add('invalid'); valid = false; }
    else { container?.classList.remove('invalid'); }
    data.push({ label: f.namn, value });
  });
  if (!valid) return;

  const adress = document.getElementById('inp_adress')?.value.trim() || '';
  data.push({ label: 'Adress', value: adress });

  const samtyckeGdpr = document.getElementById('inp_samtycke_gdpr')?.checked || false;
  const gdprEl = document.getElementById('f_samtycke_gdpr');
  if (!samtyckeGdpr) { gdprEl?.classList.add('invalid'); valid = false; } else gdprEl?.classList.remove('invalid');

  const fotoChecked = document.querySelector('input[name="samtycke_foto"]:checked');
  const samtyckeFoto = fotoChecked ? fotoChecked.value : '';
  const fotoEl = document.getElementById('f_samtycke_foto');
  if (!samtyckeFoto) { fotoEl?.classList.add('invalid'); valid = false; } else fotoEl?.classList.remove('invalid');

  if (!valid) return;

  data.push({ label: 'Godkännande av hantering av personuppgifter', value: samtyckeGdpr ? 'Ja' : 'Nej' });
  data.push({ label: 'Foto- och filmsamtycke', value: samtyckeFoto });

  if (window.__formPris) data.push({ label: 'Att betala', value: window.__formPris + ' kr' });

  const btn = document.querySelector('.submit-btn');
  btn.disabled = true;
  btn.textContent = 'Skickar...';
  try {
    const payload = { form_id: formId, data };
    const res = await fetch(WEBHOOK_SPARA, { method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    document.getElementById('mainCard').innerHTML = `
      <div class="msg"><div class="icon">✦</div><h2>Tack för din anmälan!</h2><p>Vi återkommer med bekräftelse.</p></div>`;
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Skicka anmälan';
    alert('Fel vid skickning. Försök igen.');
  }
}

function visaFel(msg) {
  document.getElementById('mainCard').innerHTML = `<div class="msg"><div class="icon">✦</div><h2>Formuläret hittades inte</h2><p>${msg}</p></div>`;
}
function partnerToggle(val){
  const id = window.__partnerTelId; if(!id) return;
  const c = document.getElementById('flt_'+id); if(!c) return;
  const show = /^\s*ja/i.test(val||'');
  c.style.display = show ? '' : 'none';
  if(!show){ const inp = c.querySelector('input'); if(inp) inp.value=''; }
}
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
laddaFormular();
</script>
</body>
</html>
